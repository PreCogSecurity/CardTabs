name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate demo copies from the authoritative sources
        run: npm run build:demo

      - name: Verify the committed demo copies are in sync
        run: git diff --exit-code -- docs/

      - name: Run the test suite
        run: npm test

      - name: Lint
        run: npm run lint